<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forsiden

    </title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav id="print-controls" aria-label="Print og billeder" hidden>
        <div class="print-options">
            <button type="button" data-print-layout="one">Print 1 gruppe pr. side</button>
            <button type="button" data-print-layout="two">Print grupper samlet</button>
            <button type="button" data-print-layout="rows">Print som vendespil</button>
        </div>
        <div class="image-controls">
            <button type="button" id="refresh-images">Hent billeder igen</button>
        </div>
    </nav>

    <template id="links">
        <h1><a class='overskriften'>Overskriften</a> <a class="ret" target="_blank">ret </a></h1>
    </template>

    <template id="forside">
        <div class="square">
            <div class="explanation">Styrer baggrundsfarven af et element.</div>
        </div>
    </template>

    <template id="bagside">
        <div class="square">
            <div class="bagside"><img class="logo" src="img/ek_logo_business-blue_rgb.png" alt="EK logo"></div>

        </div>
    </template>
    <section id="link" class="flex">
    </section>

    <p id="status" role="status" hidden></p>
    <main id="pages"></main>

    <script src="image-cache.js"></script>
    <script src="javascript.js"></script>


</body>

</html>
